name: Build v1 Read-Only Overlay

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Termux .sh bundle
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_HOME/ndk/26.1.10909125}"
          bash scripts/build_termux_sh.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: v1-debug-apk
          path: v1/build/outputs/apk/debug/*.apk

      - name: Upload Termux sh bundle
        uses: actions/upload-artifact@v4
        with:
          name: termux-sh-bundle
          path: v1/dist/native_overlay.sh
