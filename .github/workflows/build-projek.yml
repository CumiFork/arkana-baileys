name: Build Projek

on:
  push:
    branches: [ "main" ]
    paths:
      - 'projek/**'
      - '.github/workflows/build-projek.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-30 build-tools;30.0.3 ndk;22.0.7026061'

      - name: Build native lib with ndk-build
        working-directory: projek/src/main
        run: |
          $ANDROID_HOME/ndk/22.0.7026061/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk

      - name: Build injector
        run: |
          CC="$ANDROID_HOME/ndk/22.0.7026061/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          $CC -Wall -Wextra -O2 -ldl -o projek/inject projek/inject.c

      - name: Package Termux installer
        run: |
          python3 - <<'PY'
          import base64, os, tarfile, tempfile, stat
          proj = 'projek'
          built = os.path.join(proj, 'src/main/libs/arm64-v8a/libMEOW.so')
          os.makedirs(proj, exist_ok=True)
          import shutil
          shutil.copy2(built, os.path.join(proj, 'libMEOW.so'))
          payload = tempfile.NamedTemporaryFile(delete=False)
          payload.close()
          with tarfile.open(payload.name, 'w:gz') as tar:
              for name in ['libMEOW.so', 'inject', 'libMEOW.sh']:
                  tar.add(os.path.join(proj, name), arcname=name)
          b64 = base64.b64encode(open(payload.name, 'rb').read()).decode()
          os.unlink(payload.name)
          out = os.path.join(proj, 'libMEOW-termux.sh')
          script = """#!/system/bin/sh
# libMEOW Termux installer - extracts libMEOW.so, inject, libMEOW.sh
set -e
DIR="${1:-$HOME/libMEOW}"
mkdir -p "$DIR"
B64='__B64__'
echo "$B64" | base64 -d | tar -xz -C "$DIR"
chmod +x "$DIR/libMEOW.sh" "$DIR/inject" "$DIR/libMEOW.so" 2>/dev/null || true
echo "[+] Extracted to $DIR"
echo "[*] Jalankan: sh $DIR/libMEOW.sh com.dts.freefireth"
"""
          open(out, 'w').write(script.replace('__B64__', b64))
          os.chmod(out, os.stat(out).st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          print(out)
          PY

      - name: Upload libMEOW.so
        uses: actions/upload-artifact@v4
        with:
          name: projek-libMEOW
          path: projek/src/main/libs/arm64-v8a/libMEOW.so

      - name: Upload Termux installer
        uses: actions/upload-artifact@v4
        with:
          name: libMEOW-termux
          path: projek/libMEOW-termux.sh
