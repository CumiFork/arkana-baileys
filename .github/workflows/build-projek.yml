name: Build Projek

on:
  push:
    branches: [ "main" ]
    paths:
      - 'projek/**'
      - '.github/workflows/build-projek.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-30 build-tools;30.0.3 ndk;22.0.7026061'

      - name: Build native lib with ndk-build
        working-directory: projek/src/main
        run: |
          $ANDROID_HOME/ndk/22.0.7026061/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk

      - name: Build injector
        run: |
          CC="$ANDROID_HOME/ndk/22.0.7026061/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          $CC -Wall -Wextra -O2 -ldl -o projek/inject projek/inject.c

      - name: Package Termux installer
        run: |
          set -e
          OUT=projek/libMEOW-termux.sh
          PAYLOAD=$(mktemp)
          tar -C projek -czf "$PAYLOAD" libMEOW.so inject libMEOW.sh
          # ensure libMEOW.so from build is used
          cp projek/src/main/libs/arm64-v8a/libMEOW.so projek/libMEOW.so
          tar -C projek -czf "$PAYLOAD" libMEOW.so inject libMEOW.sh
          B64=$(base64 -w0 "$PAYLOAD")
          cat > "$OUT" <<'HDR'
#!/system/bin/sh
# libMEOW Termux installer - extracts libMEOW.so, inject, libMEOW.sh
set -e
DIR="${1:-$HOME/libMEOW}"
mkdir -p "$DIR"
HDR
          printf "B64='%s'\n" "$B64" >> "$OUT"
          cat >> "$OUT" <<'FTR'
echo "$B64" | base64 -d | tar -xz -C "$DIR"
chmod +x "$DIR/libMEOW.sh" "$DIR/inject" "$DIR/libMEOW.so" 2>/dev/null || true
echo "[+] Extracted to $DIR"
echo "[*] Jalankan: sh $DIR/libMEOW.sh com.dts.freefireth"
FTR
          chmod +x "$OUT"

      - name: Upload libMEOW.so
        uses: actions/upload-artifact@v4
        with:
          name: projek-libMEOW
          path: projek/src/main/libs/arm64-v8a/libMEOW.so

      - name: Upload Termux installer
        uses: actions/upload-artifact@v4
        with:
          name: libMEOW-termux
          path: projek/libMEOW-termux.sh
