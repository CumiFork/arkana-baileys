name: Build v2-mod External (NDK + APK)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Set up Android NDK
        id: ndk
        run: |
          set -euo pipefail
          NDK_DIR=""
          if [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_HOME"
          elif [ -n "${ANDROID_NDK_ROOT:-}" ] && [ -d "$ANDROID_NDK_ROOT" ]; then
            NDK_DIR="$ANDROID_NDK_ROOT"
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR=$(ls -1d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n1 || true)
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "NDK not found on runner" >&2
            exit 1
          fi
          echo "ndk_dir=$NDK_DIR" >> "$GITHUB_OUTPUT"
          echo "NDK_DIR=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build arm64-v8a .so (ndk-build)
        id: build
        run: |
          set -euo pipefail
          export PATH="$NDK_DIR:$PATH"
          SO_PATH=""
          if [ -f "v2-mod/src/main/jni/Android.mk" ]; then
            echo "Building with ndk-build (v2-mod)"
            pushd v2-mod/src/main/jni >/dev/null
            ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk APP_ABI=arm64-v8a APP_PLATFORM=android-24 -j"$(nproc)"
            popd >/dev/null
            SO_PATH=$(find v2-mod/src/main/jni/libs/arm64-v8a -name '*.so' | head -n1)
          else
            echo "No Android.mk found" >&2
            exit 1
          fi
          if [ -z "$SO_PATH" ] || [ ! -f "$SO_PATH" ]; then
            echo "Built .so not found" >&2
            exit 1
          fi
          echo "so_path=$SO_PATH" >> "$GITHUB_OUTPUT"
          echo "Built: $SO_PATH"
          file "$SO_PATH"

      - name: Build APK (external overlay)
        working-directory: v2-mod
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$NDK_DIR}"
          gradle assembleDebug --stacktrace

      - name: Package self-extracting run_imgui.sh
        run: |
          set -euo pipefail
          SO_PATH="${{ steps.build.outputs.so_path }}"
          B64=$(base64 -w0 "$SO_PATH")
          cat > run_imgui.sh <<'SCRIPT'
          #!/system/bin/sh
          # Self-extracting v2-mod external .so payload
          set -e
          OUT="/data/local/tmp/libimgui.so"
          TMP="/data/local/tmp/.libimgui.b64.$$"
          extract() {
            cat > "$TMP" <<'__PAYLOAD__'
          SCRIPT
          printf '%s\n' "$B64" >> run_imgui.sh
          cat >> run_imgui.sh <<'SCRIPT'
          __PAYLOAD__
            base64 -d "$TMP" > "$OUT" 2>/dev/null || busybox base64 -d "$TMP" > "$OUT"
            rm -f "$TMP"
            chmod 755 "$OUT"
          }
          run_as_root() {
            if command -v su >/dev/null 2>&1; then su -c "$1"; else sh -c "$1"; fi
          }
          echo "[*] Extracting payload to $OUT"
          extract
          if command -v su >/dev/null 2>&1; then
            PKG="com.mobile.legends"
            PID=$(run_as_root "pidof $PKG 2>/dev/null | awk '{print \$1}'" | tr -d '\r' || true)
            if [ -n "$PID" ]; then
              LIBDIR=$(run_as_root "ls -d /data/app/*/${PKG}*/lib/arm64 2>/dev/null | head -1" | tr -d '\r' || true)
              if [ -n "$LIBDIR" ]; then
                DST="$LIBDIR/libimgui.so"
                run_as_root "cp '$OUT' '$DST' && chmod 755 '$DST' && (chcon u:object_r:apk_data_file:s0 '$DST' 2>/dev/null || true)"
                echo "[+] Staged: $DST"
                echo "[*] External overlay APK recommended. For legacy inject: su -c 'inject $PID $DST'"
                exit 0
              fi
            fi
            echo "[+] Extracted: $OUT"
          else
            echo "[!] Root/su not detected; manual install required."
          fi
          SCRIPT
          chmod +x run_imgui.sh
          ls -lh run_imgui.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2-mod-external
          path: |
            run_imgui.sh
            v2-mod/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          make_latest: true
          files: |
            run_imgui.sh
            v2-mod/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
