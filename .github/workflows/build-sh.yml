name: Build v2-mod External (NDK + APK)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Set up Android NDK
        id: ndk
        run: |
          set -euo pipefail
          NDK_DIR=""
          if [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_HOME"
          elif [ -n "${ANDROID_NDK_ROOT:-}" ] && [ -d "$ANDROID_NDK_ROOT" ]; then
            NDK_DIR="$ANDROID_NDK_ROOT"
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR=$(ls -1d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n1 || true)
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "NDK not found on runner" >&2
            exit 1
          fi
          echo "ndk_dir=$NDK_DIR" >> "$GITHUB_OUTPUT"
          echo "NDK_DIR=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build arm64-v8a (ndk-build)
        id: build
        run: |
          set -euo pipefail
          export PATH="$NDK_DIR:$PATH"
          if [ -f "v2-mod/src/main/jni/Android.mk" ]; then
            echo "Building with ndk-build (v2-mod)"
            pushd v2-mod/src/main/jni >/dev/null
            ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk APP_ABI=arm64-v8a APP_PLATFORM=android-24 -j"$(nproc)"
            popd >/dev/null
          else
            echo "No Android.mk found" >&2
            exit 1
          fi
          BIN_PATH=$(find v2-mod/src/main/jni/libs/arm64-v8a -type f -name 'v2mod' | head -n1)
          SO_PATH=$(find v2-mod/src/main/jni/libs/arm64-v8a -type f -name '*.so' | head -n1)
          if [ -z "$BIN_PATH" ] || [ ! -f "$BIN_PATH" ]; then
            echo "Built v2mod binary not found" >&2
            find v2-mod/src/main/jni/libs -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "bin_path=$BIN_PATH" >> "$GITHUB_OUTPUT"
          echo "so_path=${SO_PATH:-}" >> "$GITHUB_OUTPUT"
          echo "Built binary: $BIN_PATH"
          file "$BIN_PATH"
          if [ -n "$SO_PATH" ] && [ -f "$SO_PATH" ]; then file "$SO_PATH"; fi

      - name: Package self-extracting v2mod.sh
        run: |
          set -euo pipefail
          BIN_PATH="${{ steps.build.outputs.bin_path }}"
          B64=$(base64 -w0 "$BIN_PATH")
          cat > v2mod.sh <<'SCRIPT'
          #!/system/bin/sh
          # Self-extracting v2-mod standalone native overlay
          # Extracts to /data/local/tmp, runs as root, cleans up on exit.
          set -eu

          PAYLOAD_BIN="v2mod.bin"
          OUT_DIR="/data/local/tmp"
          OUT_BIN="$OUT_DIR/$PAYLOAD_BIN"
          TMP_B64="$OUT_DIR/.v2mod.b64.$$"

          cleanup() {
            rm -f "$TMP_B64" "$OUT_BIN" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          extract_payload() {
            cat > "$TMP_B64" <<'__PAYLOAD__'
          SCRIPT
          printf '%s\n' "$B64" >> v2mod.sh
          cat >> v2mod.sh <<'SCRIPT'
          __PAYLOAD__
            if command -v base64 >/dev/null 2>&1; then
              base64 -d "$TMP_B64" > "$OUT_BIN"
            elif command -v busybox >/dev/null 2>&1; then
              busybox base64 -d "$TMP_B64" > "$OUT_BIN"
            else
              echo "[!] base64 decoder not found" >&2
              exit 1
            fi
            rm -f "$TMP_B64"
            chmod 755 "$OUT_BIN"
          }

          if [ "$(id -u 2>/dev/null || echo 1)" -ne 0 ]; then
            if command -v su >/dev/null 2>&1; then
              echo "[*] Root required, re-exec via su"
              exec su -c "sh '$0' "$@""
            fi
            echo "[!] Root not available. Run: su -c 'sh $0'" >&2
            exit 1
          fi

          export PATH="/system/bin:/system/xbin:/vendor/bin:/sbin:$PATH"
          echo "[*] Extracting v2mod standalone to $OUT_BIN"
          extract_payload
          echo "[*] Starting v2mod overlay (Ctrl+C to exit)"
          "$OUT_BIN" "$@"
          STATUS=$?
          echo "[*] v2mod exited with status $STATUS"
          exit $STATUS
          SCRIPT
          chmod +x v2mod.sh
          ls -lh v2mod.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2-mod-standalone
          path: |
            v2mod.sh
            v2-mod/src/main/jni/libs/arm64-v8a/v2mod
            v2-mod/src/main/jni/libs/arm64-v8a/*.so

      - name: Publish GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          make_latest: true
          files: |
            v2mod.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
